org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.caching=true

# Miuix (HyperOS design system) version, used by the gallery module.
miuixVersion=0.9.4

# Parallel project execution is off: this machine resolves dependencies through a transparent
# HTTP proxy that drops TLS handshakes when too many connections are opened at once, and the
# resulting "Remote host terminated the handshake" failures are not real dependency problems.
org.gradle.parallel=false

# This machine's network goes through a transparent proxy that Gradle cannot complete a TLS
# handshake against, so Gradle is told about it explicitly. Delete these lines on a host with
# direct network access.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
# Give slow proxy reads room instead of failing the resolution.
systemProp.http.socketTimeout=180000
systemProp.http.connectionTimeout=60000
systemProp.https.socketTimeout=180000
systemProp.https.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=60000
