// LSPosed module that gives Xiaomi's camera an Apple-style liquid glass watermark.
//
// AGP 9 has built-in Kotlin support, so `org.jetbrains.kotlin.android` is deliberately NOT
// applied here: the plugin is rejected outright from AGP 9.0 onward.
// The Compose compiler plugin IS applied separately (it must match AGP's embedded Kotlin).
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing uses one fixed keystore that is committed to this repository on purpose.
//
// The keystore is not a secret here: LiquidFrame is an open-source LSPosed module whose
// users install CI artifacts directly. Signing every build with the same key is what lets
// a new APK update over an installed one without an uninstall first; a per-developer or
// per-run key would force users to wipe the module and its settings on every release.
// (This matches the project's original design, restored after an intermediate revision
// switched to injected properties that CI never supplied, silently producing unsigned
// release APKs while still labelling them signed.)
//
// The debug build shares the same config, so any artifact of any build type can replace
// any other. To sign with your own key instead, point LIQUIDFRAME_KEYSTORE (plus the three
// companion values) at it; those overrides win, and nothing else in the build changes.
def lfSigning = { key -> project.findProperty(key) ?: System.getenv(key) }
def lfStorePath = lfSigning('LIQUIDFRAME_KEYSTORE')
def lfStorePassword = lfSigning('LIQUIDFRAME_KEYSTORE_PASSWORD')
def lfKeyAlias = lfSigning('LIQUIDFRAME_KEY_ALIAS')
def lfKeyPassword = lfSigning('LIQUIDFRAME_KEY_PASSWORD')
def lfStoreFile = lfStorePath ? file(lfStorePath) : null
def lfOverrideSigning = lfStoreFile?.isFile() && lfStorePassword && lfKeyAlias && lfKeyPassword

android {
    namespace "com.mouya.LiquidFrame"
    compileSdk 37

    defaultConfig {
        applicationId "com.mouya.LiquidFrame"
        minSdk 26
        targetSdk 35
        versionCode 37
        versionName "2.1.1"
    }

    signingConfigs {
        create("shared") {
            if (lfOverrideSigning) {
                storeFile lfStoreFile
                storePassword lfStorePassword
                keyAlias lfKeyAlias
                keyPassword lfKeyPassword
            } else {
                // The committed keystore. Present in the tree by design; see the note above.
                storeFile file("keystore/liquidframe-release.p12")
                storePassword "liquidframe2026"
                keyAlias "liquidframe"
                keyPassword "liquidframe2026"
            }
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.getByName("shared")
        }
        debug {
            minifyEnabled false
            // Same key as release on purpose: a debug build must be able to replace an
            // installed release build (and vice versa) without an uninstall.
            signingConfig signingConfigs.getByName("shared")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'androidx.annotation:annotation:1.9.1'

    // Compose runtime — the config UI uses Compose, not the hook itself.
    // These versions match the gallery module to keep the classpath consistent.
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.foundation:foundation:1.7.6'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.ui:ui-graphics:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.material:material-icons-core:1.7.6'
    implementation 'androidx.compose.material:material-icons-extended:1.7.6'
    implementation 'androidx.core:core:1.13.0'

    // Liquid glass component stack (kyant0). shapes + capsule are pure geometry with no
    // API floor; backdrop needs RuntimeShader (API 33+) and is gated in the components below.
    implementation 'io.github.kyant0:backdrop:2.0.0'
    implementation 'io.github.kyant0:shapes:1.2.0'
    implementation 'io.github.kyant0:capsule:2.1.3'
}