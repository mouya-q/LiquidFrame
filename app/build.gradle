// LSPosed module that gives Xiaomi's camera an Apple-style liquid glass watermark.
//
// AGP 9 has built-in Kotlin support, so `org.jetbrains.kotlin.android` is deliberately NOT
// applied here: the plugin is rejected outright from AGP 9.0 onward.
// The Compose compiler plugin IS applied separately (it must match AGP's embedded Kotlin).
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// A fixed keystore is committed to this repository so every CI build signs with the same
// key and updates install over previous versions without an uninstall.  The LIQUIDFRAME_*
// Gradle properties below override this path/password for developers who want to sign
// locally with their own key; when absent the committed keystore is used.
def lfSigning = { key -> project.findProperty(key) ?: System.getenv(key) }
def lfStorePath    = lfSigning('LIQUIDFRAME_KEYSTORE')          ?: "keystore/liquidframe-release.p12"
def lfStorePassword = lfSigning('LIQUIDFRAME_KEYSTORE_PASSWORD') ?: "liquidframe2026"
def lfKeyAlias     = lfSigning('LIQUIDFRAME_KEY_ALIAS')          ?: "liquidframe"
def lfKeyPassword  = lfSigning('LIQUIDFRAME_KEY_PASSWORD')       ?: "liquidframe2026"
def lfStoreFile    = file(lfStorePath)
def lfExternalSigning = lfStoreFile?.isFile() && lfStorePassword && lfKeyAlias && lfKeyPassword

android {
    namespace "com.mouya.LiquidFrame"
    compileSdk 37

    defaultConfig {
        applicationId "com.mouya.LiquidFrame"
        minSdk 26
        targetSdk 35
        versionCode 39
        versionName "2.2.0"
    }

    signingConfigs {
        if (lfExternalSigning) {
            create("shared") {
                storeFile lfStoreFile
                storePassword lfStorePassword
                keyAlias lfKeyAlias
                keyPassword lfKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (lfExternalSigning) signingConfig signingConfigs.getByName("shared")
        }
        debug {
            minifyEnabled false
            if (lfExternalSigning) signingConfig signingConfigs.getByName("shared")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'androidx.annotation:annotation:1.9.1'

    // Compose runtime — the config UI uses Compose, not the hook itself.
    // These versions match the gallery module to keep the classpath consistent.
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.foundation:foundation:1.7.6'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.ui:ui-graphics:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.material:material-icons-core:1.7.6'
    implementation 'androidx.compose.material:material-icons-extended:1.7.6'
    implementation 'androidx.core:core:1.13.0'

    // Liquid glass component stack (kyant0). shapes + capsule are pure geometry with no
    // API floor; backdrop needs RuntimeShader (API 33+) and is gated in the components below.
    implementation 'io.github.kyant0:backdrop:2.0.0'
    implementation 'io.github.kyant0:shapes:1.2.0'
    implementation 'io.github.kyant0:capsule:2.1.3'
}