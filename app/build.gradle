// LSPosed module that gives Xiaomi's camera an Apple-style liquid glass watermark.
//
// AGP 9 has built-in Kotlin support, so `org.jetbrains.kotlin.android` is deliberately NOT
// applied here: the plugin is rejected outright from AGP 9.0 onward.
plugins {
    id 'com.android.application'
}

android {
    namespace "com.mouya.LiquidFrame"
    compileSdk 35

    defaultConfig {
        applicationId "com.mouya.LiquidFrame"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'androidx.annotation:annotation:1.9.1'
    // LSPosed 高级接口 (libxposed-interface 101.0.0)，对齐 MusicHapticsX API level
    compileOnly files('libs/libxposed-interface-101.0.0.aar')

    // DexKit for robust hook target discovery across camera versions
    implementation 'org.luckypray:dexkit:2.2.0'
}
