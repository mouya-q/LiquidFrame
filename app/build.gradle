// LSPosed module that gives Xiaomi's camera an Apple-style liquid glass watermark.
//
// AGP 9 has built-in Kotlin support, so `org.jetbrains.kotlin.android` is deliberately NOT
// applied here: the plugin is rejected outright from AGP 9.0 onward.
// The Compose compiler plugin IS applied separately (it must match AGP's embedded Kotlin).
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace "com.mouya.LiquidFrame"
    compileSdk 37

    defaultConfig {
        applicationId "com.mouya.LiquidFrame"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "1.8.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use the debug signing key for release builds so every CI build is signed
            // consistently. This fixes "安装失败，与已安装 APK 签名不一致" when updating.
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'androidx.annotation:annotation:1.9.1'
    compileOnly files('libs/libxposed-interface-101.0.0.aar')

    // Compose runtime — the config UI uses Compose, not the hook itself.
    // These versions match the gallery module to keep the classpath consistent.
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.foundation:foundation:1.7.6'
    implementation 'androidx.compose.ui:ui:1.7.6'
    implementation 'androidx.compose.ui:ui-graphics:1.7.6'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.material:material-icons-core:1.7.6'
    implementation 'androidx.compose.material:material-icons-extended:1.7.6'
    implementation 'androidx.core:core:1.13.0'

    // Liquid glass component stack (kyant0). shapes + capsule are pure geometry with no
    // API floor; backdrop needs RuntimeShader (API 33+) and is gated in the components below.
    implementation 'io.github.kyant0:backdrop:2.0.0'
    implementation 'io.github.kyant0:shapes:1.2.0'
    implementation 'io.github.kyant0:capsule:2.1.3'
}