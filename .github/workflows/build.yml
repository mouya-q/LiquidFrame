name: Build LiquidFrame


on:
 workflow_dispatch:
 push:
  branches:
   - main


jobs:

 build:

  runs-on: ubuntu-latest


  steps:

  - uses:
      actions/checkout@v4


  - name:
      Setup JDK

    uses:
      actions/setup-java@v4

    with:

      java-version: 17

      distribution: temurin



  - name:
      Build APK

    run:

      chmod +x gradlew

      ./gradlew assembleRelease



  - name:
      Upload APK

    uses:
      actions/upload-artifact@v4

    with:

      name: LiquidFrame

      path:
       app/build/outputs/apk/release/*.apk