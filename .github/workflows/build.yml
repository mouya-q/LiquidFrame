name: Build LiquidFrame

# Debug APK build on every push to main, plus manual dispatch.
#
# This deliberately does NOT install an Android SDK action. The ubuntu-latest runner
# already ships one, and `android-actions/setup-android@v3` currently fails on it with
#   Warning: Failed to find package 'tools'
#   Error: .../sdkmanager failed with exit code 1
# (observed on run 42855595010) because it tries to install a package that no longer
# exists upstream. The previous green builds worked for the same reason: no SDK action.
#
# Debug is deliberate: on-device behaviour does not depend on the variant, and Debug uses
# Android's standard debug key, so CI never needs a private keystore. Release builds stay
# local (see SIGNING_SETUP.md) so no signing material can reach the repo or the logs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build gallery debug APK
        run: ./gradlew :gallery:assembleDebug --no-daemon --stacktrace

      - name: Verify the module APK contains the hook entry point
        # A green run with an empty or stale artifact is worse than a red one: it looks
        # shippable. This fails the run if there is no APK, no dex, or the Xposed entry
        # class is missing from the built dex.
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::no app debug APK produced"
            exit 1
          fi
          echo "artifact: $APK"
          ls -l "$APK"
          unzip -l "$APK" | grep -E 'classes.*\.dex' \
            || (echo "::error::no dex in APK"; exit 1)
          unzip -p "$APK" classes.dex > /tmp/classes.dex
          if ! strings /tmp/classes.dex | grep -qi 'LiquidFrameHook'; then
            echo "::error::LiquidFrameHook missing from classes.dex"
            exit 1
          fi
          echo "hook entry point present"

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFrame-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload gallery APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFrame-gallery-debug
          path: gallery/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30