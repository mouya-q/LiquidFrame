name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null 2>&1 || true

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :gallery:assembleRelease --stacktrace --no-daemon

      - name: Verify the release APK is signed with the project key
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort | tail -n1)
          test -n "$APKSIGNER"
          for apk in app/build/outputs/apk/release/*.apk gallery/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "--- $apk ---"
            "$APKSIGNER" verify --print-certs "$apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep -q "SHA-256 digest: 6e85bc51" || {
              echo "ERROR: $apk is not signed with the project key (expected SHA-256 6e85bc51...b3ea)"
              exit 1
            }
          done
          echo "signed: ok"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFrame-release
          path: |
            app/build/outputs/apk/release/*.apk
            gallery/build/outputs/apk/release/*.apk
          if-no-files-found: error