name: Build LiquidFrame

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

    - name: Build gallery debug APK
      run: ./gradlew :gallery:assembleDebug --no-daemon --stacktrace

    - name: Upload app APK
      uses: actions/upload-artifact@v4
      with:
        name: LiquidFrame-app-debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Upload gallery APK
      uses: actions/upload-artifact@v4
      with:
        name: LiquidFrame-gallery-debug
        path: gallery/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
