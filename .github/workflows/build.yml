name: Build

# Builds a Debug APK on every push to main plus manual dispatch.
#
# Debug is deliberate: the module's on-device behaviour does not depend on the Release
# variant, and Debug uses Android's standard debug key, so CI never needs a private
# keystore. Release builds stay a local operation (see SIGNING_SETUP.md) so no signing
# material can leak into the repository or the workflow logs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" > /dev/null || \
            sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble Debug
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK really contains the hook entry point
        # A green build with an empty or stale artifact is worse than a red one: it looks
        # shippable. This fails the run if the Xposed entry class is missing from the dex,
        # or if the version code on disk is not the one this commit declares.
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::no debug APK produced"
            exit 1
          fi
          echo "artifact: $APK"
          ls -l "$APK"
          unzip -l "$APK" | grep -E 'classes.*\.dex' || (echo "::error::no dex in APK"; exit 1)
          unzip -p "$APK" classes.dex > /tmp/classes.dex
          if ! strings /tmp/classes.dex | grep -qi 'LiquidFrameHook'; then
            echo "::error::LiquidFrameHook missing from classes.dex"
            exit 1
          fi
          echo "hook entry point present"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquidframe-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30