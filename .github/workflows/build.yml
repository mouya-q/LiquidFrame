name: Build LiquidFrame

# Debug APK build on every push to main, plus manual dispatch.
#
# This deliberately does NOT install an Android SDK action. The ubuntu-latest runner
# already ships one, and `android-actions/setup-android@v3` fails on it with
#   Warning: Failed to find package 'tools'
#   Error: .../sdkmanager failed with exit code 1
# (observed on run 42855595010) because it tries to install a package that no longer
# exists upstream. The previous green builds never used an SDK action either.
#
# Debug is deliberate: on-device behaviour does not depend on the variant, and Debug uses
# Android's standard debug key, so CI never needs a private keystore. Release builds stay
# local (see SIGNING_SETUP.md) so no signing material can reach the repo or the logs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build gallery debug APK
        run: ./gradlew :gallery:assembleDebug --no-daemon --stacktrace

      - name: Verify the module APK contains the hook entry point
        # A green run with an empty or stale artifact is worse than a red one: it looks
        # shippable. This fails the run when the APK or its dex is missing, or when the
        # Xposed entry class and the structural matcher are absent from *any* dex.
        #
        # It used to check only classes.dex, which reported a false negative: with
        # minifyEnabled false AGP still splits the app across classes.dex + classes2.dex,
        # and LiquidFrameHook landed in the second one.
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::no app debug APK produced"
            exit 1
          fi
          echo "artifact: $APK"
          ls -l "$APK"

          DEXES=$(unzip -l "$APK" | awk '{print $4}' | grep -E '^classes[0-9]*\.dex$' || true)
          if [ -z "$DEXES" ]; then
            echo "::error::no dex entries in APK"
            exit 1
          fi
          echo "dex entries:"; echo "$DEXES"

          WORK=$(mktemp -d)
          for d in $DEXES; do
            unzip -p "$APK" "$d" > "$WORK/$d"
          done

          if ! cat "$WORK"/*.dex | strings | grep -q 'LiquidFrameHook'; then
            echo "::error::LiquidFrameHook missing from every dex"
            exit 1
          fi
          if ! cat "$WORK"/*.dex | strings | grep -q 'recordPlan'; then
            echo "::error::structural matcher (recordPlan) missing from every dex"
            exit 1
          fi
          if ! cat "$WORK"/*.dex | strings | grep -q 'selectFactoryMethod'; then
            echo "::error::factory matcher (selectFactoryMethod) missing from every dex"
            exit 1
          fi
          echo "hook entry point and both matchers present"

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFrame-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload gallery APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFrame-gallery-debug
          path: gallery/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30